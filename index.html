<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Interactive 24-slide presentation about solar energy in Vietnam."
    />
    <meta name="theme-color" content="#061426" />
    <title>Solar Panel - Solar Energy in Vietnam</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const isLocalFile = window.location.protocol === "file:";

        if (isLocalFile) {
          const style = document.createElement("link");
          style.rel = "stylesheet";
          style.href = "./dist/assets/app.css";
          document.head.appendChild(style);

          const script = document.createElement("script");
          script.src = "./dist/assets/app.js";
          document.body.appendChild(script);
          return;
        }

        const script = document.createElement("script");
        script.type = "module";
        script.src = "/src/main.tsx";
        document.body.appendChild(script);
      })();
    </script>
  </body>
</html>
